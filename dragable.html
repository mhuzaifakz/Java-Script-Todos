<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="Icon_Of_Todos_list" href="colour_full.png">
        <script src="https://unpkg.com/swapy/dist/swapy.min.js"></script>
        <title>draggAble List</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .app {
            width: 420px;
        }

        .title {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        #todo-list {
            list-style: none;
            padding: 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .dragg-able-container {
            margin-bottom: 15px;
        }

        .dragg-able-container:last-child {
            margin-bottom: 0;
        }

        .text-container {
            background: white;
            padding: 18px 20px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 500;
            cursor: grab;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            color: #667eea;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .text-container::before {
            content: "☰";
            font-size: 1.2rem;
            color: #888;
        }

        .text-container:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            background: #f7f7f7;
        }

        .text-container:active {
            cursor: grabbing;
        }

        .slot[data-swapy-highlighted] {
            background: rgba(255, 255, 255, 0.2);
            border: 2px dashed white;
            border-radius: 14px;
            padding: 4px;
            transition: 0.2s;
        }
        </style>
    </head>
    <body>
        <ul id="todo-list" type="none">
            <li class="dragg-able-container" data-swapy-slot="Foo">
                <div class="text-container" data-swapy-item="a">Learn Js in
                    AfterNoon.</div>
            </li>
            <li class="dragg-able-container" data-swapy-slot="bar">
                <div class="text-container" data-swapy-item="b">Then go to do
                    dinner.</div>
            </li>
            <li class="dragg-able-container" data-swapy-slot="baz">
                <div class="text-container" data-swapy-item="c">Sleep in
                    10pm.</div>
            </li>
            <li class="dragg-able-container" data-swapy-slot="boz">
                <div class="text-container" data-swapy-item="d">
                    Play Games For 2 Hours.</div>
            </li>
        </ul>
        <script>
       const container = document.getElementById('todo-list')

        const swapy = Swapy.createSwapy(container, {
            animation: 'dynamic' // or spring or none
        })
    </script>
    </body>
</html>
